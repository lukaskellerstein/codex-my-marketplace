approval_policy = "never"
default_permissions = "marketplace-development"

[permissions.marketplace-development]
description = "Workspace development with network access and secret-file protection."
extends = ":workspace"

[permissions.marketplace-development.filesystem]
"~/.codex" = "write"
glob_scan_max_depth = 8

[permissions.marketplace-development.filesystem.":workspace_roots"]
".git" = "write"
"**/.env" = "deny"
"**/.env.*" = "deny"
"**/*.pem" = "deny"
"**/*.key" = "deny"
"**/*.agekey" = "deny"
"**/keys.txt" = "deny"
"**/*credentials*.json" = "deny"
"**/serviceAccountKey.json" = "deny"
"**/*.tfstate" = "deny"

[permissions.marketplace-development.network]
enabled = true
